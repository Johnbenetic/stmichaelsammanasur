<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>St. Michael's Church, Sammanasur</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #ffffff;
    color: #0d3b66;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* top band */
  .band {
    background: #0d4f9e;
    color: #ffffff;
    text-align: center;
    padding: 14px 16px;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .content {
    text-align: center;
    max-width: 600px;
  }

  .icon svg {
    width: 110px;
    height: 110px;
  }

  h1 {
    font-size: 34px;
    font-weight: 400;
    color: #0d4f9e;
    margin-top: 16px;
    letter-spacing: 0.5px;
  }

  h2 {
    font-size: 14px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: #3d76bb;
    margin-top: 4px;
    margin-bottom: 36px;
  }

  .badge {
    display: inline-block;
    border: 2px solid #0d4f9e;
    color: #0d4f9e;
    font-size: 24px;
    font-weight: bold;
    padding: 12px 28px;
    border-radius: 999px;
    margin-bottom: 22px;
  }

  @keyframes blink {
    0%, 45% { opacity: 1; }
    50%, 95% { opacity: 0.15; }
    100% { opacity: 1; }
  }
  .blink { animation: blink 1.6s infinite; }

  .submessage {
    font-size: 15px;
    color: #3d5a7a;
    line-height: 1.7;
    max-width: 440px;
    margin: 0 auto;
  }

  footer {
    text-align: center;
    padding: 16px;
    font-size: 12px;
    color: #7392b8;
    letter-spacing: 0.5px;
    border-top: 1px solid #eaf2fb;
  }

</style>
</head>
<body>
  <div class="band">Parish website coming soon</div>

  <main>
    <div class="content">
      <div class="icon">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of an archangel with wings, a sword, and a halo">
          <path d="M100 60 C60 40 20 55 15 95 C40 85 65 90 85 105 Z" fill="#a9c9ef" opacity="0.9"/>
          <path d="M100 60 C140 40 180 55 185 95 C160 85 135 90 115 105 Z" fill="#a9c9ef" opacity="0.9"/>
          <circle cx="100" cy="48" r="16" fill="none" stroke="#0d4f9e" stroke-width="4"/>
          <circle cx="100" cy="58" r="13" fill="#eaf2fb"/>
          <path d="M78 78 C78 78 70 130 65 165 L135 165 C130 130 122 78 122 78 Z" fill="#3d76bb"/>
          <path d="M92 78 L100 100 L108 78 Z" fill="#0d4f9e"/>
          <rect x="72" y="112" width="56" height="6" fill="#ffffff"/>
          <line x1="145" y1="60" x2="105" y2="130" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
          <line x1="130" y1="80" x2="150" y2="70" stroke="#0d4f9e" stroke-width="5" stroke-linecap="round"/>
          <circle cx="147" cy="63" r="5" fill="#0d4f9e"/>
        </svg>
      </div>

      <h1>St. Michael's Church</h1>
      <h2>Sammanasur</h2>

      <div class="badge blink">This website is under construction</div>

      <p class="submessage">We're working on bringing our parish online. Please check back soon for updates on services, events, and community news.</p>
    </div>
  </main>

  <footer>&copy; St. Michael's Church, Sammanasur</footer>
</body>
</html>
