<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>St. Michael's Church, Sammanasur</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: linear-gradient(160deg, #eaf2fb 0%, #cfe0f7 50%, #a9c9ef 100%);
    color: #123a66;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    text-align: center;
    max-width: 580px;
    width: 100%;
    background: #ffffff;
    border: 1px solid #cfe0f7;
    border-radius: 24px;
    padding: 48px 32px;
    box-shadow: 0 20px 50px rgba(18, 58, 102, 0.15);
  }
  .icon {
    margin-bottom: 20px;
  }
  .icon svg {
    width: 120px;
    height: 120px;
    filter: drop-shadow(0 4px 10px rgba(18, 58, 102, 0.2));
  }
  h1 {
    font-size: 32px;
    font-weight: 400;
    letter-spacing: 1px;
    margin-bottom: 6px;
    color: #0d4f9e;
  }
  h2 {
    font-size: 15px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #3d76bb;
    margin-bottom: 32px;
  }
  .divider {
    width: 90px;
    height: 3px;
    background: linear-gradient(90deg, #0d4f9e, #3d76bb, #a9c9ef);
    margin: 0 auto 32px;
    border-radius: 2px;
  }
  .message {
    font-size: 26px;
    font-weight: bold;
    line-height: 1.6;
    color: #0d4f9e;
    margin-bottom: 18px;
    -webkit-text-stroke: 0.5px #0d4f9e;
  }
  @keyframes blink {
    0%, 45% { opacity: 1; }
    50%, 95% { opacity: 0.2; }
    100% { opacity: 1; }
  }
  .blink {
    animation: blink 1.6s infinite;
  }
  .submessage {
    font-size: 15px;
    color: #3d5a7a;
    line-height: 1.7;
  }
  footer {
    margin-top: 40px;
    font-size: 13px;
    color: #7392b8;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of an archangel with wings, a sword, and a halo">
        <!-- wings -->
        <path d="M100 60 C60 40 20 55 15 95 C40 85 65 90 85 105 Z" fill="#a9c9ef" opacity="0.9"/>
        <path d="M100 60 C140 40 180 55 185 95 C160 85 135 90 115 105 Z" fill="#a9c9ef" opacity="0.9"/>
        <!-- halo -->
        <circle cx="100" cy="48" r="16" fill="none" stroke="#0d4f9e" stroke-width="4"/>
        <!-- head -->
        <circle cx="100" cy="58" r="13" fill="#eaf2fb"/>
        <!-- body/robe -->
        <path d="M78 78 C78 78 70 130 65 165 L135 165 C130 130 122 78 122 78 Z" fill="#3d76bb"/>
        <path d="M92 78 L100 100 L108 78 Z" fill="#0d4f9e"/>
        <!-- belt -->
        <rect x="72" y="112" width="56" height="6" fill="#ffffff"/>
        <!-- sword -->
        <line x1="145" y1="60" x2="105" y2="130" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
        <line x1="130" y1="80" x2="150" y2="70" stroke="#0d4f9e" stroke-width="5" stroke-linecap="round"/>
        <circle cx="147" cy="63" r="5" fill="#0d4f9e"/>
      </svg>
    </div>
    <h1>St. Michael's Church</h1>
    <h2>Sammanasur</h2>
    <div class="divider"></div>
    <p class="message blink">This website is under construction</p>
    <p class="submessage">We're working on bringing our parish online. Please check back soon for updates on services, events, and community news.</p>
    <footer>&copy; St. Michael's Church, Sammanasur</footer>
  </div>
</body>
</html>
